name: Deploy website to Surge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate sitemap.xml
        run: |
          # Tạo sitemap đơn giản hoặc chạy lệnh build sitemap của bạn tại đây nếu có
          # Ví dụ tự tạo danh sách file html hoặc dùng công cụ sitemap

      - name: Deploy to Surge
        run: npx --yes surge@latest ./ briannguyen.surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
